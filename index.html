<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALVéON">
<meta name="description" content="ALVéON PRIVÉ — L'excellence est personnelle.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>ALVéON PRIVÉ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-dust"></div>
  <div class="sp-shot s1"><img src="assets/art/selfmade.webp" alt=""><b>Forged.</b></div>
  <div class="sp-shot s2"><img src="assets/art/fall.webp" alt=""><b>Fallen.</b></div>
  <div class="sp-final">
    <div class="sp-stage">
      <div class="sp-glow"></div>
      <img class="sp-logo" src="assets/logo-full.webp" alt="">
    </div>
    <div class="sp-word"><span style="--i:0">A</span><span style="--i:1">L</span><span style="--i:2">V</span><span style="--i:3">é</span><span style="--i:4">O</span><span style="--i:5">N</span><span class="sp" style="--i:6"></span><span style="--i:7" class="gold">P</span><span style="--i:8" class="gold">R</span><span style="--i:9" class="gold">I</span><span style="--i:10" class="gold">V</span><span style="--i:11" class="gold">É</span></div>
    <div class="sp-tag">What stands in the way becomes the way.</div>
    <div class="sp-by">Marcus Aurelius</div>
  </div>
</div>
<div id="app"><main class="view" id="view"></main></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
